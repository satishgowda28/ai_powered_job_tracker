version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries/"
    schema: "db/migration/"
    gen:
      go:
        package: "generated"
        out: "./db/generated/"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        overrides:
          - db_type: "text"
            go_type: "string"
            nullable: true
